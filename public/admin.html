<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book Platform Admin — cross-product operations for Write My Book" />
    <title>Book Platform Admin</title>
    <link rel="icon" href="wmb-icon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin-desk.css" />
    <link rel="stylesheet" href="admin-responsive.css" />
    <link rel="stylesheet" href="applications/admin/admin-app.css" />
    <style>
        .admin-shell-nav {
            display: flex;
            gap: 0.35rem;
            margin: 1.25rem 0 1.5rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.35rem;
        }
        .admin-shell-tab {
            appearance: none;
            border: 1px solid #d4d0c8;
            background: transparent;
            color: var(--color-muted);
            font: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.55rem 0.9rem;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
        }
        .admin-shell-tab:hover {
            color: var(--color-text);
            background: var(--color-surface2);
            border-color: #c4bfb5;
        }
        .admin-shell-tab.is-active {
            color: var(--color-text);
            background: var(--color-surface2);
            border-color: #c4bfb5;
            border-bottom-color: var(--color-surface2, #fff);
            box-shadow: inset 0 -2px 0 var(--color-accent, #2f6fed);
        }
        .admin-desk-view.hidden,
        .admin-projects-view.hidden {
            display: none !important;
        }
        .admin-desk-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        .admin-desk-lead {
            color: var(--color-muted);
            margin: 0.25rem 0 0;
            font-size: 0.9rem;
        }
        .admin-desk-home-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-end;
            margin-bottom: 1.5rem;
        }
        .admin-desk-project-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            align-items: center;
        }
        body.admin-page {
            padding-top: var(--header-h, 65px);
            height: 100dvh;
            max-height: 100dvh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        body.admin-page .a-topbar.admin-desk-topbar {
            /* Match author book chrome: fixed top bar, menu on the right */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 250;
            background: var(--c-surface, #fff);
        }
        body.admin-page .admin-desk-topbar .a-topbar-brand {
            gap: 0.55rem;
        }
        body.admin-page .admin-desk-topbar .logo-sub {
            margin-left: 0.15rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--c-muted, #6b7280);
        }
        body.admin-page .admin-desk-topbar .a-logo-version,
        body.admin-page .admin-desk-topbar .logo-version {
            font-size: 0.65rem;
            color: var(--c-muted, #6b7280);
            margin-left: 0.35rem;
            font-weight: 500;
            opacity: 0.7;
        }
        body.admin-page .admin-desk-topbar .logo-database-env {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-left: 0.45rem;
            padding: 0.12rem 0.42rem;
            border-radius: 999px;
            border: 1px solid transparent;
            line-height: 1.2;
        }
        body.admin-page .admin-desk-topbar .logo-database-env--stage {
            color: #1d4ed8;
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        body.admin-page .admin-desk-topbar .logo-database-env--prod {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }
        body.admin-page .admin-desk-topbar .a-user {
            margin-left: auto;
        }
        body.admin-page .admin-desk-topbar .reader-close.hidden {
            display: none !important;
        }
        .admin-desk-project-label {
            font-size: 0.9rem;
        }
        .admin-desk-project-label--muted {
            color: var(--color-muted);
            max-width: 28rem;
        }
        .admin-desk-group {
            margin-bottom: 1.75rem;
        }
        .admin-desk-group-label {
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--color-muted);
            margin: 0 0 0.65rem;
        }
        .admin-desk-book-hint {
            color: var(--color-muted);
            font-size: 0.88rem;
            margin: 0 0 0.75rem;
        }
        .admin-desk-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
            gap: 0.75rem;
        }
        .admin-desk-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.45rem;
            text-align: left;
            padding: 0.9rem;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: var(--color-surface);
            color: var(--color-text);
            cursor: pointer;
            font: inherit;
            min-height: 5.5rem;
        }
        .admin-desk-card:hover:not(:disabled) {
            border-color: var(--color-accent, #2f6fed);
            background: var(--color-surface2);
        }
        .admin-desk-card--disabled,
        .admin-desk-card:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .admin-desk-card-icon {
            font-size: 1.25rem;
            line-height: 1;
        }
        .admin-desk-card-label {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.3;
        }
        body.admin-page > .container:has(.admin-shell-nav) {
            flex: 0 0 auto;
            width: min(100%, var(--max-width, 900px));
        }
        body.admin-page .admin-desk-view,
        body.admin-page .admin-projects-view {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.admin-page .admin-desk-view.hidden,
        body.admin-page .admin-projects-view.hidden {
            display: none !important;
        }
        body.admin-page .admin-desk-view > main.container,
        body.admin-page .admin-projects-view > main.container {
            flex: 1 1 auto;
            min-height: 0;
            width: min(100%, var(--max-width, 900px));
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.admin-page .site-footer {
            flex-shrink: 0;
        }
        #admin-desk-workspace {
            min-height: 0;
        }
        /* Desk tool panels: full viewport under the fixed topbar */
        #admin-desk-workspace.admin-desk-workspace--active {
            position: fixed;
            top: var(--header-h, 65px);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            margin: 0;
            width: 100vw;
            height: calc(100dvh - var(--header-h, 65px));
            max-height: calc(100dvh - var(--header-h, 65px));
            display: flex;
            flex-direction: column;
            background: var(--c-bg, #f5f4f0);
            overflow: hidden;
        }
        body.admin-desk-workspace-open .admin-shell-nav,
        body.admin-desk-workspace-open .site-footer {
            display: none !important;
        }
        body.admin-desk-workspace-open .admin-desk-view > main.container {
            max-width: none;
            width: 100%;
            margin: 0;
            padding: 0 !important;
            overflow: hidden;
        }
        #admin-desk-workspace.admin-desk-workspace--active .my-desk-empty,
        #admin-desk-workspace.my-desk-body--workspace .my-desk-empty.book-audit-host {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
            height: 100%;
            width: 100%;
            margin: 0;
        }
        #admin-desk-workspace.admin-desk-workspace--active .desk-workspace-shell {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            width: 100%;
        }
        #admin-desk-workspace.admin-desk-workspace--active .desk-ai-prompts-body,
        #admin-desk-workspace.admin-desk-workspace--active .desk-ai-prompts-iframe {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
        }
        #admin-desk-workspace.admin-desk-workspace--active .desk-ai-prompts-iframe iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body class="admin-page">
    <header class="a-topbar admin-desk-topbar">
        <div class="a-topbar-brand">
            <img src="wmb-icon.png" alt="Book Platform Admin icon" style="width:34px;height:34px;object-fit:contain;border-radius:8px;" />
            <span class="a-logo">Book Platform Admin</span>
            <span class="logo-sub">Admin</span>
            <span class="logo-version" id="app-version"></span>
            <span class="logo-database-env hidden" id="app-database-env" aria-label="Database environment"></span>
        </div>
        <div class="a-user">
            <div class="a-menu" id="admin-menu">
                <button class="a-menu-toggle" id="a-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="a-menu-list" title="Open menu">
                    <span class="a-menu-icon" aria-hidden="true"></span>
                    <span class="sr-only">Open menu</span>
                </button>
                <div class="a-menu-list hidden" id="a-menu-list" role="menu" aria-hidden="true">
                    <button class="a-menu-item hidden" id="a-menu-item-return-book" role="menuitem" type="button">Return to book</button>
                    <button class="a-menu-item" id="a-menu-item-signout" role="menuitem" type="button">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <nav class="admin-shell-nav" aria-label="Admin sections">
            <button type="button" class="admin-shell-tab is-active" id="admin-tab-desk" data-admin-tab="desk">Admin Desk</button>
            <button type="button" class="admin-shell-tab" id="admin-tab-projects" data-admin-tab="projects">Book Projects</button>
        </nav>
    </div>

    <div id="admin-desk-view" class="admin-desk-view">
        <main class="container" style="padding-block: 0 2.5rem;">
            <div id="admin-desk-home" class="admin-desk-home">
                <div class="loading-block">Loading Admin Desk…</div>
            </div>
            <div id="admin-desk-workspace" class="my-desk-body">
                <div id="my-desk-empty" class="my-desk-empty"></div>
                <div id="my-desk-coming-soon" class="my-desk-coming-soon hidden">
                    <div class="my-desk-coming-soon-inner">
                        <div class="my-desk-coming-soon-icon">🚧</div>
                        <h3>Coming Soon</h3>
                        <p>This feature is on its way.</p>
                    </div>
                </div>
                <div id="my-desk-editor" class="hidden" aria-hidden="true"></div>
            </div>
        </main>
    </div>

    <div id="admin-projects-view" class="admin-projects-view hidden">
        <main class="container admin-projects-main">
            <div id="projects-workspace" class="projects-workspace">
                <div class="projects-top">
                    <div id="projects-summary" class="projects-summary" aria-live="polite"></div>
                    <button class="btn btn-ghost btn-sm" id="btn-unhide-all" type="button" style="display:none"></button>
                </div>

                <section class="projects-find" aria-labelledby="projects-find-heading">
                    <h2 id="projects-find-heading" class="visually-hidden">Find books</h2>
                    <div class="projects-find-bar">
                        <div class="projects-find-search">
                            <label class="visually-hidden" for="projects-search-q">Search books</label>
                            <input
                                type="search"
                                id="projects-search-q"
                                class="field-input projects-search-input"
                                placeholder="Author, email, title, status, invite…"
                                autocomplete="off"
                                enterkeyhint="search"
                            />
                        </div>
                        <button class="btn btn-primary projects-new-btn" id="btn-new-project" type="button">+ New</button>
                    </div>
                </section>

                <div id="new-project-form" class="card projects-new-form" style="display:none">
                    <h3 class="projects-new-form-title">New book</h3>
                    <div class="form-grid">
                        <div class="field">
                            <label for="inp-name">Author Name <span class="required">*</span></label>
                            <input type="text" id="inp-name" placeholder="e.g. Margaret Chen" />
                        </div>
                        <div class="field">
                            <label for="inp-title">Working Title</label>
                            <input type="text" id="inp-title" placeholder="e.g. Steward: How I Built a Healthcare Empire" />
                        </div>
                        <div class="field">
                            <label for="inp-booktype">Book Type</label>
                            <select id="inp-booktype" class="field-input" style="height:42px" aria-busy="true">
                                <option value="">Loading book types…</option>
                            </select>
                        </div>
                    </div>
                    <div class="field" style="margin-top: .75rem;">
                        <label for="inp-audience">Target Audience</label>
                        <input type="text" id="inp-audience" placeholder="e.g. Mid-career executives building their first company" />
                    </div>
                    <div class="field" style="margin-top: .65rem;">
                        <label for="inp-author-uid">Authorized Author <span class="required">*</span></label>
                        <select id="inp-author-uid" class="field-input" style="height:42px">
                            <option value="">Select an explicit author account</option>
                        </select>
                    </div>
                    <div class="hstack new-project-form-actions" style="gap: .75rem; margin-top: 1rem;">
                        <button class="btn btn-primary" id="btn-create-submit">Create Project</button>
                        <button class="btn btn-ghost" id="btn-cancel-new">Cancel</button>
                    </div>
                    <p id="create-error" class="error-text" style="display:none;"></p>
                </div>

                <section id="projects-recent-section" class="projects-recent" aria-labelledby="projects-recent-heading">
                    <div class="projects-section-head">
                        <h3 id="projects-recent-heading" class="projects-section-title">Recent</h3>
                        <button type="button" class="projects-inline-link" id="btn-view-all-books">View all</button>
                    </div>
                    <div id="projects-recent-list">
                        <div class="loading-block">Loading…</div>
                    </div>
                </section>

                <section id="projects-results-section" class="projects-results" hidden aria-labelledby="projects-results-heading">
                    <div class="projects-section-head">
                        <h3 id="projects-results-heading" class="projects-section-title">Results</h3>
                        <button type="button" class="projects-inline-link" id="btn-show-recent-books">Show recent</button>
                    </div>
                    <p id="projects-result-meta" class="projects-result-meta" aria-live="polite"></p>
                    <div id="project-list"></div>
                    <div id="projects-pagination" class="projects-pagination" hidden></div>
                </section>
            </div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Book Platform Admin</p>
        </div>
    </footer>

    <div id="alert-area" class="alert-area-host" aria-live="polite" role="status"></div>

    <script src="dialogs.js"></script>
    <script src="dist/admin-desk.bundle.js"></script>
    <script src="presence-client.js"></script>
    <script src="app.js"></script>
</body>

</html>
